name: Build Raspberry Pi 5 image

# Dispatch-only by design: the image is built when someone explicitly asks
# for a build, and every dispatch leaves the artifact on the run page.
# Publishing is a separate, equally explicit decision: dispatch with
# publish=true and release_tag, and the built image, its checksums and the
# build report are attached to that release from the runner (the policy
# lives in docs/pi/image-build.md).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag or SHA to build from (default: the ref this was dispatched on)"
        default: ""
      alarm_sha256:
        description: "Pin the ALARM rootfs tarball by sha256 (empty = latest; the report records the actual)"
        default: "f10903be472e2662e110f0f7bae2750a30914ce3dc0fcd38ec85d3405d8c8967"
      root_gib:
        description: "Root partition size in GiB (16 GB cards need <= 13)"
        default: "12"
      validate_mode:
        description: "deep (default: full in-image checks; needs ~25 GiB scratch) or shallow"
        default: "deep"
      publish:
        description: "Attach the built image and its report to the release named by release_tag (the owner's explicit decision; default: no)"
        default: "false"
      release_tag:
        description: "Release tag the image assets attach to when publish=true"
        default: "pi-2026.10.12"

permissions:
  # write is needed only by the publish step, and that step runs only when
  # the dispatch explicitly asks for it; the build steps never use the token.
  contents: write

concurrency:
  group: build-pi-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - name: Check out the port
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
          # build-package.py versions the package from the commit count
          fetch-depth: 0

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mtools dosfstools e2fsprogs xz-utils libarchive-tools
          python3 -m pip install --user zstandard

      - name: Verify the package set against the live repositories
        run: |
          python3 tools/pi/package-audit.py fetch
          python3 tools/pi/package-audit.py check

      - name: Build the omarchy-dev aarch64 package
        run: python3 tools/pi/build-package.py

      - name: Build, validate and compress the image
        env:
          ALARM_SHA256: ${{ inputs.alarm_sha256 }}
          ROOT_GIB: ${{ inputs.root_gib }}
          VALIDATE_MODE: ${{ inputs.validate_mode }}
        run: |
          sudo --preserve-env=ALARM_SHA256,ROOT_GIB,VALIDATE_MODE \
            bash tools/pi/build-image.sh \
            --work-dir /mnt/omarchy-image-build \
            --out-dir "$PWD/build/out" \
            --alarm-sha256 "$ALARM_SHA256" \
            --root-gib "${ROOT_GIB:-11}" \
            --validate "${VALIDATE_MODE:-deep}" \
            --clean

      - name: Show the build report
        run: |
          cat build/out/build-report.txt
          echo
          cat build/out/SHA256SUMS

      - name: Upload the image artifact
        uses: actions/upload-artifact@v4
        with:
          name: omarchy-arm64-pi-image
          path: |
            build/out/*.img.xz
            build/out/SHA256SUMS
            build/out/build-report.txt
            build/out/image-packages.txt
            build/out/omarchy-pi-image-install.log
            build/out/omarchy-install.log
            build/out/pacman-image.log
          if-no-files-found: error
          retention-days: 30

      - name: Publish the image to the release (explicit owner decision)
        if: ${{ inputs.publish == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          mapfile -t imgs < <(ls build/out/*.img.xz)
          ((${#imgs[@]} == 1)) || { echo "expected exactly one image in build/out, found ${#imgs[@]}"; ls -la build/out; exit 1; }
          img=${imgs[0]}
          size=$(stat -c %s "$img")
          echo "publishing $(basename "$img") ($size bytes) to release $tag"
          assets=(build/out/build-report.txt build/out/image-packages.txt)
          if [[ -f build/out/SHA256SUMS ]]; then
            cp -f build/out/SHA256SUMS build/out/SHA256SUMS.image
            assets+=(build/out/SHA256SUMS.image)
          fi
          for f in omarchy-pi-image-install.log omarchy-install.log pacman-image.log; do
            if [[ -f "build/out/$f" ]]; then assets+=("build/out/$f"); fi
          done
          # GitHub caps a release asset at 2 GiB; a larger image ships as
          # numbered .part files the flasher joins back with cat.
          if (( size <= 2000000000 )); then
            assets+=("$img")
          else
            echo "the compressed image exceeds the 2 GiB per-asset limit; splitting it"
            split -b 1900000000 -d --additional-suffix=.part "$img" "$img."
            sha256sum "$img".[0-9][0-9].part > build/out/SHA256SUMS.parts
            assets+=(build/out/SHA256SUMS.parts)
            for part in "$img".[0-9][0-9].part; do assets+=("$part"); done
          fi
          gh release view "$tag" --json tagName,isPrerelease --jq '"release: " + .tagName + " (prerelease: " + (.isPrerelease|tostring) + ")"'
          gh release upload "$tag" "${assets[@]}" --clobber
          echo "published assets:"
          gh release view "$tag" --json assets --jq '.assets[] | "  \(.name)  \(.size) bytes"'
